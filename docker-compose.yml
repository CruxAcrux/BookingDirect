name: bookingdirect

services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    environment:
      # The SPA is served from the Vite dev server, so session cookies are issued for its origin.
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      # "frontend:5173" is how the end-to-end tests reach the app inside Docker.
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-5173},frontend:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan queue:work --tries=3 --backoff=10
    volumes:
      - ./backend:/var/www/html
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    depends_on:
      - backend

  # Runs scheduled jobs such as booking reminders.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    depends_on:
      - backend

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    image: node:24-alpine
    user: node
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_PROXY_TARGET: http://nginx
      API_SPEC_URL: http://nginx/docs/api.json
    depends_on:
      - nginx

  # End-to-end tests: docker compose run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: npm run e2e
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://frontend:5173
    volumes:
      - ./frontend:/app
    depends_on:
      - frontend

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: bookingdirect
      POSTGRES_USER: bookingdirect
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingdirect -d bookingdirect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
